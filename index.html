<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Novel Reader</title>
<style>
  :root {
    --bg: #000000;
    --panel: #1c1e26;
    --panel-2: #23252f;
    --text: #e6e6ea;
    --muted: #9498a8;
    --accent: #7c9eff;
    --border: #2f3140;
  }

  * { box-sizing: border-box; min-width: 0; min-height: 0; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Comic Sans MS", "Comic Sans", "Comic Neue", "Chalkboard SE", sans-serif;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: 300px;
    min-width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left .2s ease;
  }

  #sidebar.collapsed {
    margin-left: -300px;
  }

  #sidebar-header {
    padding: calc(18px + env(safe-area-inset-top)) 16px 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #sidebar-header h1 {
    margin: 0 0 12px 0;
    font-size: 20px;
    color: var(--accent);
  }

  #novel-select {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  #novel-select.hidden { display: none; }
  #novel-select:hover { border-color: var(--accent); }

  .load-btn {
    display: inline-block;
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #12141c;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
  }
  .load-btn:hover { filter: brightness(1.08); }
  .load-btn input[type=file] { display: none; }

  #chapters-folder-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.4;
  }

  #chapters-folder-status button {
    background: var(--panel-2);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    margin-top: 4px;
  }
  #chapters-folder-status button:hover { border-color: var(--accent); }

  #chapter-search {
    width: 100%;
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }

  #chapter-list {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    overscroll-behavior: none;
  }

  #chapter-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 8px 10px 12px;
    margin-bottom: 4px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.3;
    color: var(--muted);
  }

  .chapter-item-label {
    flex: 1;
    word-break: break-word;
  }

  #chapter-list li:hover {
    background: var(--panel-2);
    color: var(--text);
  }
  #chapter-list li.active {
    background: var(--accent);
    color: #12141c;
    font-weight: bold;
  }

  #empty-note {
    padding: 20px 16px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    flex-shrink: 0;
  }

  /* Main reading area */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #topbar {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 1.5%;
    width: 100%;
    padding: calc(1.5% + env(safe-area-inset-top)) 2% 1.5%;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    box-sizing: border-box;
    transition: max-height .25s ease, padding .25s ease, border-color .25s ease;
    max-height: calc(60px + env(safe-area-inset-top));
  }

  #topbar.hidden {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-bottom-color: transparent;
    overflow: hidden;
  }

  #topbar button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    flex: 1 1 0;
    min-width: 0;
    height: 40px;
    padding: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #topbar button:hover { border-color: var(--accent); }
  #topbar button:disabled { opacity: .4; cursor: not-allowed; }

  #topbar .spacer { flex: 2 1 0; min-width: 0; }

  #prev-btn, #next-btn {
    font-size: 18px;
    flex: 0.6 1 0;
  }

  #toggle-sidebar { flex: 0.6 1 0; }

  #font-controls {
    display: flex;
    align-items: center;
    gap: 1.5%;
    color: var(--muted);
    font-size: 13px;
    flex: 4 1 0;
    min-width: 0;
  }

  #font-family-select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 4px;
    font-size: 12px;
    cursor: pointer;
    flex: 2 1 0;
    min-width: 0;
    height: 40px;
  }
  #font-family-select:hover { border-color: var(--accent); }

  #theme-toggle {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    flex: 0.6 1 0;
    min-width: 0;
    height: 40px;
    padding: 0;
  }
  #theme-toggle:hover { border-color: var(--accent); }

  #theme-panel {
    position: absolute;
    top: 54px;
    right: 12px;
    z-index: 50;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 200px;
  }
  #theme-panel.hidden { display: none; }

  .theme-panel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    color: var(--text);
  }

  .theme-panel-row input[type="color"] {
    width: 44px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    padding: 0;
    cursor: pointer;
  }

  #theme-reset-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #theme-reset-btn:hover { border-color: var(--accent); }

  #reader-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: none;
    background: var(--read-bg, transparent);
  }

  #reader {
    max-width: 760px;
    width: 100%;
    padding: 50px 34px 100px 34px;
    color: var(--read-text, inherit);
  }

  #chapter-title {
    font-size: 30px;
    font-weight: bold;
    color: var(--read-text, inherit);
    margin: 0 0 4px 0;
  }

  #chapter-source {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 30px;
    word-break: break-all;
  }
  #chapter-source a { color: var(--muted); }

  #chapter-text {
    font-size: 19px;
    line-height: 1.9;
    white-space: pre-wrap;
    color: var(--read-text, inherit);
  }
  #chapter-text p { margin: 0 0 22px 0; }

  #welcome {
    max-width: 640px;
    margin: 60px auto;
    padding: 0 24px;
    text-align: center;
    color: var(--muted);
  }
  #welcome h2 { color: var(--accent); font-size: 26px; }
  #welcome .steps {
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 26px;
    margin-top: 20px;
    font-size: 15px;
    line-height: 1.7;
  }

  #bottom-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-top: 50px;
    gap: 12px;
  }

  #bottom-nav button {
    flex: 1 1 100px;
    padding: 14px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  #bottom-nav button:hover:not(:disabled) { border-color: var(--accent); }
  #bottom-nav button:disabled { opacity: .35; cursor: not-allowed; }

  #toggle-sidebar {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  /* ---------------- Mobile responsiveness ---------------- */
  @media (max-width: 720px) {
    html, body { font-size: 16px; }
    #app { position: relative; }

    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 86vw;
      max-width: 340px;
      z-index: 70;
      transition: transform .2s ease;
      transform: translateX(-100%);
      box-shadow: 4px 0 24px rgba(0,0,0,.5);
    }
    #sidebar:not(.collapsed) { transform: translateX(0); }

    #sidebar-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 65;
    }
    #sidebar-scrim.visible { display: block; }

    #sidebar-header { padding: 16px 14px 10px 14px; }
    #sidebar-header h1 { font-size: 18px; }
    .load-btn { padding: 13px 10px; font-size: 15px; }
    #chapter-search { padding: 11px 12px; font-size: 15px; }
    #chapter-list { padding: 6px; }
    #chapter-list li { padding: 13px 12px; font-size: 15px; }

    #main { width: 100%; }

    #reader { padding: 22px 16px 110px 16px; }
    #chapter-title { font-size: 22px; line-height: 1.25; }
    #chapter-source { font-size: 12px; margin-bottom: 22px; }
    #chapter-text {
      font-size: 18px;
      line-height: 1.75;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #topbar {
      gap: 1%;
      padding: 1% 1.5%;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    #font-controls span { display: none; }
    #font-controls { gap: 1%; }
    #font-family-select { font-size: 11px; }

    #theme-panel {
      right: 8px;
      left: 8px;
      min-width: 0;
      top: 60px;
    }

    #topbar .spacer { flex: 0 1 6px; min-width: 4px; }

    #bottom-nav { margin-top: 36px; gap: 8px; }
    #bottom-nav button {
      padding: 14px 8px;
      font-size: 14px;
      min-height: 48px;
    }

    #welcome { margin: 32px auto; padding: 0 16px; }
    #welcome h2 { font-size: 22px; }
    #welcome .steps { padding: 16px 18px; font-size: 14px; }
  }
</style>
</head>
<body>

<div id="sidebar-scrim"></div>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>📖 Novels</h1>
      <select id="novel-select" class="hidden"></select>
      <button class="load-btn" id="open-chapters-btn">Grant storage access</button>
      <div id="chapters-folder-status"></div>
      <input type="text" id="chapter-search" placeholder="Filter chapters...">
    </div>
    <ul id="chapter-list"></ul>
    <div id="empty-note">No novels found yet. This app reads from /storage/emulated/0/Novel — tap "Grant storage access" to allow it, then add a subfolder per novel with its .txt chapter files inside.</div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="toggle-sidebar">☰</button>
      <button id="prev-btn" disabled>‹</button>
      <button id="next-btn" disabled>›</button>
      <div class="spacer"></div>
      <div id="font-controls">
        <select id="font-family-select" title="Font style" autocomplete="off">
          <option value="'Comic Sans MS', 'Comic Sans', 'Comic Neue', sans-serif">Comic Sans</option>
          <option value="Papyrus, 'Papyrus Condensed', fantasy, sans-serif">Papyrus</option>
          <option value="Arial, Helvetica, sans-serif">Arial</option>
          <option value="Calibri, Candara, Segoe, 'Segoe UI', sans-serif">Calibri</option>
          <option value="'Times New Roman', Times, Georgia, serif">Times New Roman</option>
        </select>
        <span>Aa</span>
        <button id="font-smaller">–</button>
        <button id="font-bigger">+</button>
        <button id="theme-toggle" title="Customize reading colors">🎨</button>
      </div>
    </div>

    <div id="theme-panel" class="hidden">
      <div class="theme-panel-row">
        <label for="bg-color-input">Background</label>
        <input type="color" id="bg-color-input" value="#000000">
      </div>
      <div class="theme-panel-row">
        <label for="text-color-input">Text</label>
        <input type="color" id="text-color-input" value="#e6e6ea">
      </div>
      <button id="theme-reset-btn">Reset to default</button>
    </div>

    <div id="reader-scroll">
      <div id="welcome"></div>
      <div id="reader" style="display:none;">
        <h2 id="chapter-title"></h2>
        <div id="chapter-source"></div>
        <div id="chapter-text"></div>
        <div id="bottom-nav">
          <button id="bottom-prev" disabled>‹ Previous Chapter</button>
          <button id="bottom-next" disabled>Next Chapter ›</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="reader.js"></script>
</body>
</html>
